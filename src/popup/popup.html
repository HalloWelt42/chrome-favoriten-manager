<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FavGrid</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>FavGrid</span>
      </div>
    </header>

    <main class="popup-content">
      <button id="add-current" class="action-btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <div class="btn-text">
          <span class="btn-title" data-i18n="addCurrentPage">Aktuelle Seite hinzufügen</span>
          <span class="btn-subtitle" id="current-url" data-i18n="loading">Lädt...</span>
        </div>
      </button>

      <div class="divider"></div>

      <div class="quick-stats">
        <div class="stat">
          <span class="stat-value" id="total-favorites">0</span>
          <span class="stat-label" data-i18n="favorites">Favoriten</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="total-groups">0</span>
          <span class="stat-label" data-i18n="group">Gruppen</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="group-select">
        <label data-i18n="addToGroup">Zur Gruppe hinzufügen:</label>
        <select id="target-group"></select>
      </div>
    </main>

    <footer class="popup-footer">
      <button id="open-newtab" class="link-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M9 3v18M21 9H9"/>
        </svg>
        <span data-i18n="openSpeedDial">Speed Dial öffnen</span>
      </button>
      <button id="open-donate" class="link-btn donate-link">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <span data-i18n="thankYou">Ich möchte Danke sagen</span>
      </button>
    </footer>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="../lib/i18n.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
